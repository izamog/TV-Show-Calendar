name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      # Codacy reports coverage as a repository metric; without an upload it
      # reads as zero and drags the grade down regardless of how well lib/ is
      # tested. Skipped on forks, where the secret is not exposed, so a fork's
      # pull request still runs the rest of the pipeline instead of failing at
      # a step it cannot authenticate.
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        # Pinned to a SHA, not @v1. A mutable tag on a third-party action can
        # be repointed at new code by its owner, which would run here with the
        # coverage token in scope. This is v1 as of 2026-08-16.
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      - name: Production build
        run: npm run build
        env:
          # The build does not call TMDB (pages render on-demand), but provide a
          # dummy value so nothing trips on a missing variable during the build.
          TMDB_READ_ACCESS_TOKEN: dummy-build-token
